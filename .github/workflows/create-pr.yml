name: Create Pull Request

on:
  push:
    branches:
      - '**'

jobs:
  create-pr:
    if: |
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(github.event.head_commit.message, 'MLOPS')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request from pushed branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh pr list \
            --head "${GITHUB_REF_NAME}" \
            --base "${{ github.event.repository.default_branch }}" \
            --json number \
            --limit 1 | grep -q '"number"'; then
            echo "Ya existe un PR para la rama ${GITHUB_REF_NAME}."
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${GITHUB_REF_NAME}" \
            --title "PR automático: ${GITHUB_REF_NAME}" \
            --body "Se creó este Pull Request automáticamente porque el commit incluyó la palabra MLOPS."
