name: Create Pull Request

on:
  push:
    branches:
      - '**'

jobs:
  create-pr:
    if: |
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(github.event.head_commit.message, 'MLOPS')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ github.ref_name }}
          title: "PR automático: ${{ github.ref_name }}"
          body: |
            Se creó este Pull Request automáticamente porque el commit incluyó la palabra `MLOPS`.

            - Rama origen: `${{ github.ref_name }}`
            - Rama destino: `${{ github.event.repository.default_branch }}`
            - Commit: `${{ github.event.head_commit.message }}`
